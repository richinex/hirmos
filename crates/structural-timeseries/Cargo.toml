[package]
name = "hirmos-structural-timeseries"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
hirmos-causal-core = { path = "../causal-core" }
nalgebra = "0.34"
spec_math = "0.1.6"
rand_core = { version = "=0.9.5", default-features = false }
rand_distr = { version = "=0.5.1", default-features = false, features = ["std"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.test.package.hirmos-structural-timeseries]
opt-level = 2
