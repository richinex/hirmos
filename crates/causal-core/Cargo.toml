[package]
name = "hirmos-causal-core"
version = "0.1.0"
edition = "2021"
description = "Parity-tested causal kernels owned by Hirmos"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }
chrono = { version = "0.4", default-features = false }
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
libm = "0.2"
clarabel = "=0.11.1"
rustc_apfloat = "=0.2.3"
ecos-reference-port = { path = "../honest-did-ecos-port" }
osqp-reference-port = { path = "../honest-did-osqp-port" }
nalgebra = { version = "0.34", features = ["libm", "std"] }
puruspe = "0.4"
faer = { version = "=0.24.4", default-features = false, features = ["std", "linalg"] }
levenberg-marquardt = { version = "=0.15.0", path = "reference/levenberg-marquardt-0.15.0", features = ["scipy-fma"] }
regex = "1"
rustfft = { version = "=6.4.1", default-features = false }
sha1 = "=0.10.7"
spec_math = "0.1.6"

qd = "=0.8.0"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
