<!doctype html>
<html lang="en" data-theme="sketchbook-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/hirmos.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>Hirmos</title>
    <script>
      // Resolve the saved theme before React paints so the landing page and workbench share a palette.
      try {
        var t = localStorage.getItem('hirmos-theme')
        var known = ['dark', 'light', 'sketchbook', 'sketchbook-white']
        if (known.indexOf(t) === -1) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'sketchbook-white'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
