<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/hirmos.svg" />
    <link rel="preload" href="/fonts/source-serif-4-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#000000" />
    <title>Hirmos · browser causal inference workbench</title>
    <meta name="description" content="Prepare data, examine discovery evidence, specify and validate a DAG, identify an effect, and compare causal estimates in one local-first browser workbench." />
    <script>
      document.documentElement.dataset.surface = location.pathname === '/' ? 'landing' : 'workbench'
      try {
        var t = localStorage.getItem('hirmos-theme')
        var known = ['dark', 'light']
        if (known.indexOf(t) === -1) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Real first-viewport HTML: the product claim and workbench route survive slow or failed JS. -->
    <div id="root">
      <main class="landing-root">
        <div class="landing-scene landing-scene--fallback" aria-hidden="true"></div>
        <div class="landing-scrim" aria-hidden="true"></div>
        <header class="landing-header">
          <div class="landing-width landing-header__row">
            <a class="landing-wordmark" href="/" aria-label="Hirmos home">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10.59 7.93L7.88 12.8"/><path d="M13.41 7.93L16.12 12.8"/><path d="M8.1 17.6L13.3 17.6"/></g>
                <g fill="currentColor"><path d="M6.61 15.07L6.56 12.29L9 13.65Z"/><path d="M17.39 15.07L15 13.65L17.44 12.29Z"/><path d="M15.9 17.6L13.5 19L13.5 16.2Z"/><circle cx="12" cy="5.4" r="2"/><circle cx="5.2" cy="17.6" r="2"/><circle cx="18.8" cy="17.6" r="2"/></g>
              </svg>
              <span>hirmos</span>
            </a>
          </div>
        </header>
        <div class="landing-width landing-hero-shell">
          <section class="landing-hero-copy" aria-labelledby="landing-title">
            <p class="landing-eyebrow">My causal inference workbench</p>
            <h1 id="landing-title" class="landing-headline">Hirmos offers a framework for causal inference.</h1>
            <div class="landing-actions">
              <a class="landing-primary" href="/app">Start an analysis</a>
              <a class="landing-secondary" href="#workflow">See the workflow</a>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script>
      if (location.pathname !== '/') document.getElementById('root').replaceChildren()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
