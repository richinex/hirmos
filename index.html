<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/hirmos.svg?v=directed-h" />
    <meta name="theme-color" content="#16305A" />
    <title>Hirmos · browser causal inference workbench</title>
    <meta name="description" content="Prepare data, examine discovery evidence, specify and validate a DAG, identify an effect, and compare causal estimates in one local-first browser workbench." />
    <script>
      document.documentElement.dataset.surface = location.pathname === '/' ? 'landing' : 'workbench'
      try {
        var t = localStorage.getItem('hirmos-theme')
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Real first-viewport HTML: the product claim and workbench route survive slow or failed JS. -->
    <div id="root">
      <main class="landing-root">
        <div class="landing-band band-texture">
          <div class="landing-scene" aria-hidden="true"></div>
          <div class="landing-scrim" aria-hidden="true"></div>
          <header class="landing-header">
            <div class="landing-width landing-header__row">
              <a class="landing-wordmark" href="/" aria-label="Hirmos home">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <rect width="32" height="32" rx="7" fill="var(--color-rail-active, #234478)"/>
                  <g fill="var(--color-rail-ink, #ffffff)"><path d="M7 7h5v7h6v-4l8 6-8 6v-4h-6v7H7z"/><path d="M21 7h4v5l-4-3zm0 16 4-3v5h-4z"/></g>
                </svg>
                <span>hirmos</span>
              </a>
            </div>
          </header>
          <div class="landing-width landing-hero-shell">
            <section class="landing-hero-copy" aria-labelledby="landing-title">
              <h1 id="landing-title" class="landing-headline">A scratchpad for causal inference.</h1>
              <div class="landing-actions">
                <a class="landing-primary" href="/app">Start an analysis</a>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script>
      if (location.pathname !== '/') document.getElementById('root').replaceChildren()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
